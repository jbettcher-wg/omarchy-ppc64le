#!/hint/bash
# shellcheck disable=2034
# 00-power8.conf -- POWER8 (ISA 2.07) codegen for the secondary target.
#
# Copied into <buildroot>/makepkg.conf.d/ by tools/build-ppc64le.sh, which
# fills the baseline pool: this file keeps the ISA name because that is what it
# sets (-mcpu=power8), while the pool is named for what it runs on. makepkg
# sources <config>.d/*.conf after the config bq generates, so this overrides
# /etc/makepkg.conf for that build only and touches nothing global. See
# docs/power8-secondary-target.md, section 3.
#
# Substitution, not restatement, so the host's hardening flags survive; the
# asserts make a config rewrite fail the build instead of quietly shipping
# POWER9 code.
CFLAGS="${CFLAGS//power9/power8}"
CXXFLAGS="${CXXFLAGS//power9/power8}"
# /etc/makepkg.conf.d/fortran.conf sets -mcpu without -mtune, but
# tools/makepkg.conf.power8 states both -- so append only when absent, or
# that config resolves to a duplicated -mtune=power8.
FFLAGS="${FFLAGS//power9/power8}"
case "$FFLAGS" in *-mtune=*) ;; *) FFLAGS="$FFLAGS -mtune=power8" ;; esac
FCFLAGS="$FFLAGS"
RUSTFLAGS="${RUSTFLAGS//pwr9/pwr8}"

for _p8 in CFLAGS CXXFLAGS FFLAGS FCFLAGS; do
	case "${!_p8}" in *-mcpu=power8*) ;;
		*) printf 'power8 drop-in: %s has no -mcpu=power8: %s\n' "$_p8" "${!_p8}" >&2; exit 1 ;;
	esac
	case "${!_p8}" in *power9*|*pwr9*)
		printf 'power8 drop-in: %s still names power9: %s\n' "$_p8" "${!_p8}" >&2; exit 1 ;;
	esac
done
unset _p8
case "$RUSTFLAGS" in *pwr9*)
	printf 'power8 drop-in: RUSTFLAGS still names pwr9: %s\n' "$RUSTFLAGS" >&2; exit 1 ;;
esac

# Go. GOPPC64 is not a flag any of the above reaches, and Go does NOT default to
# power8 here: the go toolchain bakes its own default GOPPC64 in when the
# toolchain itself is built, and ours was built on POWER9, so `go env GOPPC64`
# answers power9. Every Go package the POWER8 builder produced before this line
# existed was therefore compiled -- silently -- for ISA 3.0: gum 2.0.0-1 scanned
# 52,485 ISA 3.0 instructions and `go version -m` reports GOPPC64=power9, and it
# took an illegal instruction on the first `gum style` in a POWER8 guest.
# Exported explicitly, and asserted, rather than trusting any toolchain default.
export GOPPC64=power8
case "$GOPPC64" in power8) ;;
	*) printf 'power8 drop-in: GOPPC64 is %s, not power8\n' "$GOPPC64" >&2; exit 1 ;;
esac

# Recipes with their own POWER9 pins read these (chromium _power8_compat, rust
# _power8). Exported so makepkg's environment carries them into the PKGBUILD.
export _power8_compat=1 _power8=1
