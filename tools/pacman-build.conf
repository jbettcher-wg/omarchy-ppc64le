# pacman-build.conf -- the package universe as the *build queue* sees it.
#
# This file exists so that tooling can resolve against our own repo without the
# live system ever seeing it.  Use it with --config; never install it as
# /etc/pacman.conf.  RULES.md forbids adding this repo to the running machine,
# and for good reason: repo/ is half-populated and deliberately *ahead of*
# Arch POWER, so a live pacman -Syu against it would offer to replace working
# system packages with our rebuilds.
#
#   pacman --config tools/pacman-build.conf \
#          --root  <scratch> --dbpath <scratch>/var/lib/pacman -Sy ...
#
# RootDir and DBPath are deliberately NOT set here.  A caller that forgets to
# pass them gets the live database, which is exactly the accident this file is
# meant to prevent -- so tools/build-queue.sh always passes both, and refuses
# to run if they point at /.

[options]
Architecture = powerpc64le
HoldPkg      = pacman glibc
CheckSpace
ParallelDownloads = 5
DisableSandbox

# Arch POWER signs its databases; ours are unsigned local files.  Set the
# strict policy globally and relax it per-repo rather than the reverse.
SigLevel          = Required DatabaseOptional
LocalFileSigLevel = Optional

# Ours first.  This repo is by definition the complement of Arch POWER plus
# rebuilds that are newer than it, so when a name appears in both, the one we
# built is the one the queue must link against.
[omarchy-ppc64le]
SigLevel = Optional TrustAll
Server = file:///home/jbettcher/Development/omarchy-ppc64le/repo

[base-any]
Server = https://repo.archlinuxpower.org/base/any

[base]
Server = https://repo.archlinuxpower.org/base/$arch
