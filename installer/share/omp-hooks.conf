# /etc/mkinitcpio.conf.d/omp-hooks.conf
#
# THE mkinitcpio SUBSTITUTION. This replaces upstream Omarchy's
# etc/mkinitcpio.conf.d/omarchy_hooks.conf, which is:
#
#   HOOKS=(base udev plymouth keyboard autodetect microcode modconf kms
#          keymap consolefont block encrypt filesystems fsck btrfs-overlayfs)
#
# Four things are wrong with that array on this platform, and any one of them
# is enough to make `mkinitcpio -P` exit non-zero and leave the machine with no
# regenerated initramfs:
#
#   btrfs-overlayfs  provided only by limine-mkinitcpio-hook. There is no
#                    limine on ppc64le, so /usr/lib/initcpio/install/btrfs-overlayfs
#                    does not exist and mkinitcpio errors out.
#   plymouth         its initcpio hook ships with plymouth; the array names it
#                    unconditionally, so an install without plymouth fails.
#   microcode        x86 CPU microcode. Harmless but meaningless on POWER9.
#   udev (not systemd)
#                    it converts a working systemd initramfs into a busybox one.
#                    That is a whole-boot-path change, and sd-vconsole /
#                    sd-encrypt have no busybox equivalents configured here.
#
# What replaces it is not an invention: it is the HOOKS array that is measured
# working on the AC922 today, plus the storage modules spelled optionally.
#
# HOOKS, in order, and why each is here:
#   base systemd   systemd-in-initrd. Everything below assumes it.
#   plymouth       the boot splash, with the kernel's `quiet splash`
#                  (OMP_CMDLINE in omp-install). Right after systemd, where
#                  upstream puts it after udev. Safe now that plymouth is in
#                  omp-base.packages: the "install without plymouth" failure
#                  above cannot happen on a target this installer builds.
#   autodetect     trims to the modules actually in use. Safe under
#                  arch-chroot only because the live medium runs on the target
#                  machine; the explicit MODULES below are the belt to its
#                  braces, so a wrong autodetect cannot cost the root device.
#   modconf        /etc/modprobe.d into the image
#   kms            early KMS -- amdgpu on this hardware
#   keyboard keymap sd-vconsole
#                  console input and the configured layout, for a passphrase
#                  prompt or an emergency shell
#   block          block device modules
#   filesystems    ext4 / btrfs support
#   fsck           fsck the ext4 /boot and anything else fstab marks
#
# Deliberately absent: `encrypt`/`sd-encrypt` (petitboot cannot read an
# encrypted /boot; LUKS on / is possible later and is out of scope here),
# `microcode`, `btrfs-overlayfs`, `consolefont` (sd-vconsole does it).
#
# MODULES: the trailing `?` is load-bearing, not cosmetic.
# mkinitcpio's add_module() only counts a module as found when modinfo reports
# a `filename:` that looks like a path. A module compiled *into* the kernel
# reports `filename: (builtin)`, so a bare name errors with
# "module not found: 'btrfs'". The user's own 7.2.2 config has
# CONFIG_BLK_DEV_NVME=y, CONFIG_EXT4_FS=y and CONFIG_BTRFS_FS=y -- all builtin --
# while Arch POWER's stock `linux` ships all three as .ko. `name?` makes
# add_module tolerate the miss, so one file is correct for both kernels.
#
# (Consequence worth knowing: the live machine's current
# `MODULES=(amdgpu btrfs)` names btrfs *without* the `?`, and btrfs is builtin
# in its running kernel.)

MODULES+=(nvme? nvme_core? ext4? btrfs? virtio_blk? virtio_pci? virtio_scsi? amdgpu?)

HOOKS=(base systemd plymouth autodetect modconf kms keyboard keymap sd-vconsole block filesystems fsck)
