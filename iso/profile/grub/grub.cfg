# NOTE: archisolabel=ARCH_NNNNNN is a TEMPLATE, not a value. mkarchiso rewrites
# it with  sed 's@archisolabel=ARCH_[[:digit:]]\{6\}@archisolabel=$iso_label@g'
# so it must keep exactly that shape -- ARCH_ followed by six digits -- or the
# substitution silently misses and the live medium will not find its squashfs.

set default=0
set timeout=10

#
# @P9_KERNEL_PKG@ and @P9_BOOT_LABEL@ are rendered by iso/build.sh from the pool:
# linux-omarchy / "Omarchy ppc64le" for the baseline, linux-power9 /
# "Omarchy POWER9" for --power9. A POWER8 must not be handed a power9 kernel.

set default=0
set timeout=10

menuentry '@P9_BOOT_LABEL@ Install (4K pages)' {
        set gfxpayload=keep
        insmod normal
        echo    'Loading @P9_KERNEL_PKG@ ...'
        linux   /arch/boot/ppc64le/vmlinuz-@P9_KERNEL_PKG@ --- loglevel=3 archisobasedir=arch archisolabel=ARCH_202209
        echo    'Loading initial ramdisk ...'
        initrd  /arch/boot/ppc64le/initramfs-@P9_KERNEL_PKG@.img
}

menuentry '@P9_BOOT_LABEL@ Install (4K pages, serial hvc0)' {
        set gfxpayload=keep
        insmod normal
        echo    'Loading @P9_KERNEL_PKG@ ...'
        linux   /arch/boot/ppc64le/vmlinuz-@P9_KERNEL_PKG@ --- console=hvc0 loglevel=3 archisobasedir=arch archisolabel=ARCH_202209
        echo    'Loading initial ramdisk ...'
        initrd  /arch/boot/ppc64le/initramfs-@P9_KERNEL_PKG@.img
}
