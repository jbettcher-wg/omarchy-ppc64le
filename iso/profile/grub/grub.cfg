# NOTE: archisolabel=ARCH_NNNNNN is a TEMPLATE, not a value. mkarchiso rewrites
# it with  sed 's@archisolabel=ARCH_[[:digit:]]\{6\}@archisolabel=$iso_label@g'
# so it must keep exactly that shape -- ARCH_ followed by six digits -- or the
# substitution silently misses and the live medium will not find its squashfs.

set default=0
set timeout=10

menuentry 'Omarchy POWER9 Install (4K pages)' {
        set gfxpayload=keep
        insmod normal
        echo    'Loading linux-power9 ...'
        linux   /arch/boot/ppc64le/vmlinuz-linux-power9 --- loglevel=3 archisobasedir=arch archisolabel=ARCH_202209
        echo    'Loading initial ramdisk ...'
        initrd  /arch/boot/ppc64le/initramfs-linux-power9.img
}

menuentry 'Omarchy POWER9 Install (4K pages, serial hvc0)' {
        set gfxpayload=keep
        insmod normal
        echo    'Loading linux-power9 ...'
        linux   /arch/boot/ppc64le/vmlinuz-linux-power9 --- console=hvc0 loglevel=3 archisobasedir=arch archisolabel=ARCH_202209
        echo    'Loading initial ramdisk ...'
        initrd  /arch/boot/ppc64le/initramfs-linux-power9.img
}
