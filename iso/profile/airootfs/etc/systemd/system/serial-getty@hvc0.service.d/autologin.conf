# Autologin on the OPAL serial console.
#
# archiso ships this only for getty@tty1. On PowerNV the console reached through
# the BMC is hvc0, driven by serial-getty@hvc0.service, which has no such
# drop-in -- so a BMC session gets a login prompt instead of the installer.
# root has an empty password on the live medium, so this grants nothing that
# typing "root" at that prompt would not.
#
# With this in place, .zlogin sees tty as /dev/hvc0 and starts the configurator,
# which is what makes a serial-console install work the same as a video one.
[Service]
ExecStart=
ExecStart=-/sbin/agetty -o '-p -f -- \\u' --noclear --autologin root - $TERM
